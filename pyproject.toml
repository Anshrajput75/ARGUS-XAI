[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-xai"
version = "0.1.0"
description = "Autonomous, explainable cyber defense and network anomaly intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10",
  "networkx>=3.0", "pyyaml>=6.0", "joblib>=1.3",
]

[project.optional-dependencies]
dl = ["torch>=2.1"]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
xai = ["shap>=0.44", "lime>=0.2.0.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "redis>=5.0", "httpx>=0.26"]
dashboard = ["streamlit>=1.35", "plotly>=5.18"]
mlops = ["mlflow>=2.10"]
dev = ["pytest>=8.0", "ruff>=0.4"]
all = ["argus-xai[dl,boost,xai,api,dashboard,mlops,dev]"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
